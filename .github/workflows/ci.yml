name: CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Vox.sln

      - name: Build
        run: dotnet build Vox.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Vox.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Package the sample add-on
        run: dotnet src/Vox.App/bin/Release/net9.0-windows10.0.19041.0/Vox.App.dll --pack-addon samples/Vox.SampleAddOn/bin/Release/net9.0-windows10.0.19041.0 artifacts/vox.sample.voxaddon

      - name: Upload the sample add-on
        uses: actions/upload-artifact@v4
        with:
          name: sample-addon
          path: artifacts/vox.sample.voxaddon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
