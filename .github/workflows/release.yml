name: Release

# Builds the Vox installer (Vox.msi) and a portable zip on demand: publishes Vox.App, Vox.Watchdog
# and Vox.Service self-contained into one folder, signs them and the MSI when a certificate is
# configured (UI access needs a signed Vox in Program Files; docs/signing.md), and builds the MSI
# from them (docs/installer.md). With "Publish a GitHub release" it also makes a release (a
# pre-release unless told otherwise) with both files, so they download without a GitHub account.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (major.minor.patch)
        required: true
        default: 0.1.0
      publish:
        description: Publish a GitHub release with the installer and the portable zip
        type: boolean
        default: false
      prerelease:
        description: Mark the GitHub release as a pre-release (beta)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PUBLISH_DIR: ${{ github.workspace }}\publish\Vox
      HAS_CERTIFICATE: ${{ secrets.VOX_SIGNING_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Prepare signing
        if: env.HAS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ secrets.VOX_SIGNING_CERTIFICATE }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\vox.pfx", [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          # The UI-access manifest is embedded only in signed builds
          "VOX_SIGNING_ARGS=-p:VoxSigningCertificate=$env:RUNNER_TEMP\vox.pfx -p:VoxSignTool=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Publish Vox
        shell: pwsh
        env:
          VoxSigningPassword: ${{ secrets.VOX_SIGNING_PASSWORD }}
        run: |
          foreach ($project in 'src/Vox.App', 'src/Vox.Watchdog', 'src/Vox.Service') {
            dotnet publish $project -c Release -r win-x64 --self-contained true -o $env:PUBLISH_DIR `
              -p:Version=${{ inputs.version }} $($env:VOX_SIGNING_ARGS -split ' ')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The keyboard reference is made by running Vox.App; a framework-dependent, unsigned build can
      # run anywhere (a signed UI-access exe starts only from Program Files)
      - name: Add the keyboard reference to the user guide
        shell: pwsh
        run: |
          dotnet build src/Vox.App -c Release -o build-guide
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:PUBLISH_DIR\docs\guide" | Out-Null
          dotnet build-guide\Vox.App.dll --keyboard-reference "$env:PUBLISH_DIR\docs\guide\keyboard.html"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign the published programs
        if: env.HAS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          SIGNING_PASSWORD: ${{ secrets.VOX_SIGNING_PASSWORD }}
        run: |
          $files = 'Vox.App.exe', 'Vox.Watchdog.exe', 'Vox.Service.exe' | ForEach-Object { Join-Path $env:PUBLISH_DIR $_ }
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\vox.pfx" /p $env:SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the installer
        run: dotnet build installer/Vox.Installer -c Release -p:PublishDir="${{ env.PUBLISH_DIR }}" -p:VoxVersion=${{ inputs.version }} -o installer-out

      - name: Sign the installer
        if: env.HAS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          SIGNING_PASSWORD: ${{ secrets.VOX_SIGNING_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\vox.pfx" /p $env:SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem installer-out\*.msi).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The portable copy: the same files with an empty userConfig folder, so it keeps its settings
      # beside itself (VoxPaths) and runs from any folder or USB stick without installing
      - name: Make the portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:PUBLISH_DIR\userConfig" | Out-Null
          New-Item -ItemType File -Force "$env:PUBLISH_DIR\userConfig\.portable" | Out-Null
          Copy-Item installer-out\*.msi "Vox-${{ inputs.version }}.msi"
          Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath "Vox-${{ inputs.version }}-portable.zip"

      - name: Upload the installer and the portable zip
        uses: actions/upload-artifact@v4
        with:
          name: Vox-${{ inputs.version }}
          path: |
            Vox-${{ inputs.version }}.msi
            Vox-${{ inputs.version }}-portable.zip

      - name: Publish the GitHub release
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @()
          if ('${{ inputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create "v${{ inputs.version }}" "Vox-${{ inputs.version }}.msi" "Vox-${{ inputs.version }}-portable.zip" `
            --target $env:GITHUB_SHA --title "Vox ${{ inputs.version }}" --generate-notes @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
