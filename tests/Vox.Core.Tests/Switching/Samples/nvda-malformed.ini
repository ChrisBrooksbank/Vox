# NVDA settings with damage: Vox reads what it can
schemaVersion = 11
[speech
	this line has no equals sign
[speech]
	synth = espeak
	symbolLevel = lots
	[[espeak]]
		voice = en\en-us
		rate = 50
		rateBoost = True
		pitch = high
		volume = 250
[keyboard]
	speakTypedCharacters = 2
	speakTypedWords = 0
	useCapsLockAsNVDAModifierKey = True
[braille]
	display = freedomScientific
	translationTable = xx-unknown.ctb
	tetherTo = sideways
	showMessages = 0
	messageTimeout = 10
[[[orphan]]]
	ignored = 1
