<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tables</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1>Tables</h1>
<table>
  <caption>Train times</caption>
  <thead><tr><th scope="col">Destination</th><th scope="col">Departs</th><th scope="col">Platform</th></tr></thead>
  <tbody>
    <tr><th scope="row">Leeds</th><td>09:15</td><td>4</td></tr>
    <tr><th scope="row">York</th><td>09:40</td><td rowspan="2">7</td></tr>
    <tr><th scope="row">Hull</th><td>10:05</td></tr>
  </tbody>
</table>
<h2>Sortable</h2>
<table>
  <tr><th aria-sort="ascending">Name</th><th>Score</th></tr>
  <tr><td>Ada</td><td>9</td></tr>
  <tr><td>Grace</td><td>8</td></tr>
</table>
<h2>Spanning header</h2>
<table>
  <tr><th colspan="2">Quarter one</th><th colspan="2">Quarter two</th></tr>
  <tr><th>Jan</th><th>Feb</th><th>Apr</th><th>May</th></tr>
  <tr><td>1</td><td>2</td><td>4</td><td>5</td></tr>
</table>
<h2>Layout table</h2>
<table role="presentation"><tr><td>Left column text</td><td>Right column text</td></tr></table>
</body>
</html>
