<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Switch and slider</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1>Switch and slider</h1>
<button type="button" role="switch" aria-checked="false" id="wifi">Wi-Fi</button>
<p><label>Volume <input type="range" min="0" max="10" value="5"></label></p>
<div role="slider" tabindex="0" aria-label="Temperature" aria-valuemin="10" aria-valuemax="30" aria-valuenow="20" aria-valuetext="20 degrees" id="temp">20°</div>
<script>
const wifi = document.getElementById('wifi');
wifi.addEventListener('click', () => wifi.setAttribute('aria-checked', String(wifi.getAttribute('aria-checked') !== 'true')));
const temp = document.getElementById('temp');
temp.addEventListener('keydown', e => {
  let value = Number(temp.getAttribute('aria-valuenow'));
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') value = Math.min(30, value + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') value = Math.max(10, value - 1);
  else return;
  e.preventDefault();
  temp.setAttribute('aria-valuenow', value);
  temp.setAttribute('aria-valuetext', value + ' degrees');
  temp.textContent = value + '°';
});
</script>
</body>
</html>
