<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Accordion</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1>Accordion</h1>
<div id="accordion">
  <h2><button type="button" aria-expanded="true" aria-controls="p1" id="b1">Personal information</button></h2>
  <div id="p1" role="region" aria-labelledby="b1" class="panel"><label>Name <input type="text"></label></div>
  <h2><button type="button" aria-expanded="false" aria-controls="p2" id="b2">Billing address</button></h2>
  <div id="p2" role="region" aria-labelledby="b2" class="panel" hidden><label>Street <input type="text"></label></div>
</div>
<script>
document.querySelectorAll('#accordion button').forEach(button => button.addEventListener('click', () => {
  const open = button.getAttribute('aria-expanded') === 'true';
  button.setAttribute('aria-expanded', String(!open));
  document.getElementById(button.getAttribute('aria-controls')).hidden = open;
}));
</script>
</body>
</html>
