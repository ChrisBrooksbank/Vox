<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tabs</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1>Tabs</h1>
<div role="tablist" aria-label="Fruit">
  <button role="tab" id="t1" aria-selected="true" aria-controls="tp1">Apples</button>
  <button role="tab" id="t2" aria-selected="false" aria-controls="tp2" tabindex="-1">Pears</button>
  <button role="tab" id="t3" aria-selected="false" aria-controls="tp3" tabindex="-1">Plums</button>
</div>
<div role="tabpanel" id="tp1" aria-labelledby="t1" tabindex="0"><p>Apples are crisp.</p></div>
<div role="tabpanel" id="tp2" aria-labelledby="t2" tabindex="0" hidden><p>Pears are soft.</p></div>
<div role="tabpanel" id="tp3" aria-labelledby="t3" tabindex="0" hidden><p>Plums are sweet.</p></div>
<script>
const tabs = [...document.querySelectorAll('[role="tab"]')];
function select(tab) {
  tabs.forEach(t => {
    const on = t === tab;
    t.setAttribute('aria-selected', String(on));
    t.tabIndex = on ? 0 : -1;
    document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
  });
  tab.focus();
}
tabs.forEach((tab, i) => {
  tab.addEventListener('click', () => select(tab));
  tab.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') select(tabs[(i + 1) % tabs.length]);
    if (e.key === 'ArrowLeft') select(tabs[(i + tabs.length - 1) % tabs.length]);
  });
});
</script>
</body>
</html>
